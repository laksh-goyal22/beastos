; ============================================================================
; Limine Bootloader Configuration for Beast OS
; ============================================================================

TIMEOUT=3

:Beast OS
PROTOCOL=limine
KERNEL_PATH=boot:///boot/beast.kernel
MODULE_PATH=boot:///boot/initrd.tar
KERNEL_CMDLINE=loglevel=3

; Framebuffer configuration
RESOLUTION=1280x800x32

; Serial console for debugging
SERIAL=yes
VERBOSE=yes